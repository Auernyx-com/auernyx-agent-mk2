name: CodeQL

# Replaces GitHub's built-in CodeQL "default setup" (switched off 2026-11-27).
# Default setup never analyzes commits pushed by Dependabot, so the required
# `Analyze (javascript-typescript)` / `Analyze (python)` checks never appeared
# on Dependabot PRs. Since nothing else may push to a Dependabot branch
# (TRUNK_ENFORCEMENT.md), they sat BLOCKED forever. This workflow runs on every
# PR, Dependabot's included, with the same job names branch protection wants.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "17 4 * * 1"   # weekly, like default setup

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write   # upload results; also granted on Dependabot PR runs
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, javascript-typescript, python ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
