name: mk2-alteration-gate

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  # An approval (or dismissing one) re-runs the gate at once. This is what
  # authorizes a Dependabot PR: the dependabot-approval job reads the live
  # approval; nothing is pushed to Dependabot's branch. (No branch filter
  # exists for this event; jobs check base.ref == main instead.)
  pull_request_review:
    types: [submitted, dismissed]

# auto-authorize commits and pushes an authorization record mid-run, which
# fires a second, near-simultaneous synchronize event on this same PR. Without
# this guard, that second event's run can start while the first is still
# mid-flight, racing it and occasionally failing to schedule at all ("workflow
# file issue", 0 jobs) — not a real gate failure, just two evaluations of the
# same PR colliding. queued (not cancelled): the second run still needs to
# complete for jobs unrelated to the auth-record commit; cancelling it would
# lose that.
concurrency:
  group: mk2-alteration-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: write   # dispatch ci-tests on the record commit (see below)

jobs:
  # Runs first — creates the authorization record if the actor is allowlisted
  # and no record exists yet. Skips cleanly when actor is github-actions[bot]
  # (prevents infinite loop when this job's own commit triggers synchronize).
  auto-authorize:
    # Never on Dependabot PRs: any push to Dependabot's branch stalls its
    # checks and makes Dependabot stop managing (rebasing/superseding) the PR.
    # Those are authorized by the dependabot-approval job instead.
    if: |
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      is_allowed: ${{ steps.check-allowlist.outputs.is_allowed }}
      record_commit_sha: ${{ steps.record-commit.outputs.record_commit_sha }}
      backfill_verified: ${{ steps.verify-backfill.outputs.backfill_verified }}
    steps:
      # MK2_RECORD_PUSH_TOKEN: a fine-grained PAT (this repo only, Contents
      # read/write). A push made with the built-in GITHUB_TOKEN cannot start
      # pull_request runs, and GitHub's PR rollup ignores the
      # workflow_dispatch suite, so the record commit never got a `test` the
      # PR would count (confirmed on #198, 2026-11-09). A push made with
      # the PAT fires normal pull_request runs on the record commit, the
      # same thing close+reopen used to do by hand. Repo policy is no secrets
      # on GitHub, so this secret is intentionally NOT configured and the
      # fallback below is the normal path. After the fallback push, someone
      # must push one more commit whose message has no skip-ci marker (an
      # empty commit is fine). Close+reopen does NOT work: the marker also
      # suppresses reopen-triggered runs (seen on #200). See
      # governance/alteration-program/TRUNK_ENFORCEMENT.md.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MK2_RECORD_PUSH_TOKEN || github.token }}

      - name: Checkout PR head branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Fetch base ref for diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"

      - name: Fetch approved reviews
        id: fetch-reviews
        uses: actions/github-script@v7
        with:
          script: |
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const approved = reviews.data
              .filter(r => r.state === 'APPROVED')
              .map(r => ({ login: r.user.login }));
            core.setOutput('approved_reviewers', JSON.stringify(approved));

      - name: Determine authorized login
        id: check-allowlist
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          actor = os.environ["ACTOR"]
          allowlist_path = "governance/alteration-program/authorization/allowlist.json"
          try:
              with open(allowlist_path, encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"WARNING: could not read allowlist: {e}", file=sys.stderr)
              data = {}

          logins = data.get("authorizedLogins", [])

          def parse_logins(env_var):
              raw = os.environ.get(env_var, "[]")
              try:
                  items = json.loads(raw)
                  return [
                      item["login"]
                      for item in items
                      if isinstance(item, dict) and "login" in item
                  ]
              except (json.JSONDecodeError, TypeError) as e:
                  print(f"WARNING: could not parse {env_var}: {e}", file=sys.stderr)
                  return []

          assignee_logins = parse_logins("ASSIGNEES_JSON")
          reviewer_logins = parse_logins("REVIEWERS_JSON")
          approved_reviewer_logins = parse_logins("APPROVED_REVIEWERS_JSON")

          # Being merely assigned or requested as a reviewer is not
          # involvement -- either can happen with zero action from that
          # person. Only an actual approval (or self-authorship by an
          # allowlisted login) counts as authorization. Same fix as
          # SQUAD's squad-alteration-gate.yml (this workflow's own source
          # pattern), applied here after an independent audit found the
          # same bug in this copy.
          authorized_by = None
          for login in approved_reviewer_logins + [actor]:
              if login in logins:
                  authorized_by = login
                  break

          is_allowed = authorized_by is not None
          print(f"Actor: {actor!r}")
          print(f"Assignees (not authorizing): {assignee_logins}, Requested reviewers (not authorizing): {reviewer_logins}")
          print(f"Approved reviewers: {approved_reviewer_logins}")
          print(f"authorizedLogins: {logins}")
          print(f"authorizedBy: {authorized_by!r}, allowed: {is_allowed}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"is_allowed={'true' if is_allowed else 'false'}\n")
              if authorized_by:
                  out.write(f"authorized_by={authorized_by}\n")
          PYEOF
        env:
          # On a review event github.actor is the REVIEWER, so any review by an
          # allowlisted login (even a comment or "request changes") would read
          # as self-authorship. Use the PR author there; approvals still count
          # through APPROVED_REVIEWERS_JSON.
          ACTOR:                  ${{ github.event_name == 'pull_request_review' && github.event.pull_request.user.login || github.actor }}
          ASSIGNEES_JSON:         ${{ toJson(github.event.pull_request.assignees) }}
          REVIEWERS_JSON:         ${{ toJson(github.event.pull_request.requested_reviewers) }}
          APPROVED_REVIEWERS_JSON: ${{ steps.fetch-reviews.outputs.approved_reviewers }}

      - name: Check if authorization record already exists in this PR
        id: check-record
        if: steps.check-allowlist.outputs.is_allowed == 'true'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          # Dependabot after-merge records (records/*-dependabot-pr-N.json)
          # are not this PR's own authorization, so they don't count here.
          RECORD_COUNT=$(git diff --name-only "${BASE_SHA}...HEAD" \
            | grep -E "^governance/alteration-program/authorization/records/.*\.json$" \
            | grep -cvE -- "-dependabot-pr-[0-9]+\.json$" || true)
          echo "record_count=${RECORD_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Authorization records in PR changeset: ${RECORD_COUNT}"

      # Dependabot after-merge records this PR files (tools/open-pr.sh). Every
      # fact in each one is re-derived from GitHub here: merged, Dependabot's
      # own verified commits, manifest-only, approved by an allowlisted login
      # before the merge, same merge commit. Any mismatch fails this job, so
      # no record commit is vouched for and ci_gate.py fails closed.
      - name: Verify Dependabot after-merge records
        id: verify-backfill
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const rules = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/avrs-dependabot.js`);
            const files = execSync(`git diff --name-only --diff-filter=AM "${process.env.BASE_SHA}...HEAD"`).toString()
              .split('\n').filter((f) => f.startsWith(rules.RECORD_DIR + '/') && /-dependabot-pr-\d+\.json$/.test(f));
            if (!files.length) { core.setOutput('backfill_verified', 'none'); return; }
            const allowlist = JSON.parse(execSync(`git show "${process.env.BASE_SHA}:governance/alteration-program/authorization/allowlist.json"`).toString()).authorizedLogins || [];
            const api = rules.octokitApi(github, context.repo.owner, context.repo.repo);
            for (const f of files) {
              const record = JSON.parse(fs.readFileSync(f, 'utf8'));
              const res = await rules.verifyBackfillRecord({ api, record, allowlist });
              if (!res.ok) { core.setFailed(`${f}: ${res.reason}`); return; }
              core.info(`verified ${f}`);
            }
            core.setOutput('backfill_verified', 'true');

      - name: Create authorization record
        id: create-record
        if: >
          steps.check-allowlist.outputs.is_allowed == 'true' &&
          steps.check-record.outputs.record_count == '0'
        run: |
          python3 - <<'PYEOF'
          import json, os
          from datetime import date

          authorized_by = os.environ["AUTHORIZED_BY"]
          actor         = os.environ["ACTOR"]
          pr_number     = int(os.environ["PR_NUMBER"])
          title         = os.environ["TITLE"]
          today         = date.today().isoformat()

          record_file = (
              f"governance/alteration-program/authorization/records/"
              f"{today}-pr-{pr_number}.json"
          )

          logic = f"{authorized_by} authorized via allowlist for PR #{pr_number}: {title}"
          if actor != authorized_by:
              logic += f" (PR opened by {actor})"

          record = {
              "governance_record":   f"{today}-pr-{pr_number}",
              "authorization_logic": logic,
              "signature":           f"{authorized_by}-{today}-pr{pr_number}",
              "authorizedBy":        authorized_by,
              "authorizedAt":        today,
              "reason":              f"PR #{pr_number}: {title}",
              "pullRequest":         pr_number,
          }

          os.makedirs(os.path.dirname(record_file), exist_ok=True)
          with open(record_file, "w", encoding="utf-8") as f:
              json.dump(record, f, indent=2)
              f.write("\n")

          print(f"Created authorization record: {record_file}")
          print(json.dumps(record, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"record_file={record_file}\n")
          PYEOF
        env:
          AUTHORIZED_BY: ${{ steps.check-allowlist.outputs.authorized_by }}
          ACTOR:         ${{ github.actor }}
          PR_NUMBER:     ${{ github.event.pull_request.number }}
          TITLE:         ${{ github.event.pull_request.title }}

      - name: Commit authorization record
        id: commit-record
        if: >
          steps.check-allowlist.outputs.is_allowed == 'true' &&
          steps.check-record.outputs.record_count == '0'
        env:
          HAS_PUSH_TOKEN: ${{ secrets.MK2_RECORD_PUSH_TOKEN != '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/alteration-program/authorization/records/
          if git diff --staged --quiet; then
            echo "No authorization record changes to commit."
            exit 0
          fi
          MSG="chore: add governance authorization for PR #${{ github.event.pull_request.number }}"
          # Fallback only: a GITHUB_TOKEN push creates failed 0-job runs
          # ("workflow file issue") on the record commit, so tag it skip-ci.
          # With the PAT, the record commit must run CI normally.
          if [ "$HAS_PUSH_TOKEN" != "true" ]; then
            MSG="$MSG [skip ci]"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Record commit pushed with [skip ci]. Required checks won't run on it. Push one more commit whose message has no skip-ci marker (git commit --allow-empty), then checks run. Close+reopen does NOT work. To avoid this next time, open PRs with tools/open-pr.sh."
          fi
          git commit -m "$MSG"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The record commit above becomes the PR's new HEAD, but the pull_request
      # runs it triggers land in "action_required" and never report, so the
      # required `test` check was missing on HEAD and every auto-authorized PR
      # sat BLOCKED until someone closed and reopened it (#192, #193, #194).
      # The `gate` check is re-registered on the new HEAD further down; `test`
      # must not be faked that way, so this runs the real suite on that commit.
      # workflow_dispatch is the documented exception that GITHUB_TOKEN may
      # trigger. The PR rollup ignores this dispatched run, so it does not
      # unblock the PR on its own; the extra no-skip-ci commit does. Non-fatal:
      # if the dispatch fails, `test` stays missing (fail-closed), never
      # falsely green.
      - name: Run the test suite on the record commit
        if: steps.commit-record.outputs.pushed == 'true' && steps.commit-record.outputs.fallback == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh workflow run ci-tests.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
          echo "Dispatched ci-tests on $HEAD_REF (the record commit)."

      # Independent-audit finding (2026-09-07, round 8, critical, found via
      # SQUAD's independent audit of this same pattern -- see SQUAD#69):
      # ci_gate.py used to accept ANY well-formed authorization record whose
      # authorizedBy matched an allowlisted login -- it never verified the
      # record was actually produced by this job. A hand-written record
      # committed directly as part of an attacker's own PR (no real review,
      # no real approval) passed every check.
      #
      # This step vouches for exactly one thing: whichever commit currently
      # introduces this PR's authorization record, at the moment this job's
      # OWN live, this-run GitHub API-based authorization check (is_allowed,
      # above) says true. It runs whether this run just created the record
      # or one already existed from an earlier legitimate run on this same
      # PR -- either way, is_allowed was independently recomputed from live
      # GitHub state THIS run, not read back from the record file itself.
      # The output only reaches ci_gate.py through GitHub Actions' own
      # job-to-job data plane (needs.auto-authorize.outputs.*) -- a value an
      # attacker's own PR-branch commits cannot inject, unlike git commit
      # author/committer metadata, which is trivially spoofable locally.
      - name: Determine trusted record commit
        id: record-commit
        if: steps.check-allowlist.outputs.is_allowed == 'true'
        # The record is found by what THIS PR adds (base...HEAD), not by file
        # name, so a record committed by the author in the PR's first push
        # (tools/open-pr.sh, named by branch because the PR number doesn't
        # exist yet) is vouched for the same way as one this job pushed.
        # Trust still comes only from is_allowed above, recomputed live this
        # run. Exactly one record or nothing is vouched (gate fails closed).
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          RECORDS=$(git diff --name-only --diff-filter=AM "${BASE_SHA}...HEAD" \
            | grep -E "^governance/alteration-program/authorization/records/.*\.json$" || true)
          OWN=$(printf '%s\n' "$RECORDS" | grep -vE -- "-dependabot-pr-[0-9]+\.json$" | grep -c . || true)
          if [ "$OWN" -ne 1 ]; then
            echo "PR #${PR_NUMBER} adds ${OWN} own authorization records (need exactly 1) -- nothing vouched."
            exit 0
          fi
          # Its own record plus any Dependabot after-merge records must all
          # come from ONE commit; that commit is the one vouched for.
          SHAS=$(printf '%s\n' "$RECORDS" | while read -r f; do git log -1 --format=%H -- "$f"; done | sort -u)
          if [ "$(printf '%s\n' "$SHAS" | grep -c .)" -ne 1 ]; then
            echo "PR #${PR_NUMBER} records come from more than one commit -- nothing vouched."
            exit 0
          fi
          RECORD_FILE=$(printf '%s\n' "$RECORDS" | grep -vE -- "-dependabot-pr-[0-9]+\.json$")
          RECORD_SHA=$(git log -1 --format=%H -- "$RECORD_FILE")
          echo "record_commit_sha=${RECORD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Vouching for ${RECORD_FILE} at commit ${RECORD_SHA} (is_allowed=true this run)."

      - name: Comment on PR
        if: >
          steps.check-allowlist.outputs.is_allowed == 'true' &&
          steps.check-record.outputs.record_count == '0'
        uses: actions/github-script@v7
        env:
          AUTHORIZED_BY: ${{ steps.check-allowlist.outputs.authorized_by }}
        with:
          script: |
            const authorizedBy = process.env.AUTHORIZED_BY;
            const actor = context.actor;
            if (!authorizedBy) {
              core.warning('authorized_by is unexpectedly empty; skipping comment.');
              return;
            }
            const byLine = authorizedBy !== actor
              ? `\`${authorizedBy}\` (sponsor) on behalf of \`${actor}\``
              : `\`${authorizedBy}\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body:
                '✅ **Authorization Record Auto-Created**\n\n' +
                'A governance authorization record has been automatically created for this PR ' +
                `by ${byLine} from the authorized allowlist.\n\n` +
                'The `gate` check will run after this job completes and should pass. ' +
                '**No further action is needed.**'
            })

  # Runs after auto-authorize (or after it is skipped). Checks out the latest
  # branch HEAD so it sees any auth record auto-authorize may have just committed.
  # Dependabot PRs only. Read-only: this job pushes nothing. It checks out
  # main's copy of the rules and allowlist (not the PR's), reads the live
  # approval and the PR's commits/files, and hands the result to the gate
  # through job outputs. The record it would file is printed to the job
  # summary now and filed in the repo after the merge (tools/open-pr.sh).
  dependabot-approval:
    if: |
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approved_by: ${{ steps.check.outputs.approved_by }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout main's rules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Check the live approval
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rules = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/avrs-dependabot.js`);
            const allowlist = JSON.parse(fs.readFileSync('governance/alteration-program/authorization/allowlist.json', 'utf8')).authorizedLogins || [];
            const api = rules.octokitApi(github, context.repo.owner, context.repo.repo);
            const res = await rules.checkDependabotApproval({
              api, prNumber: context.payload.pull_request.number, allowlist,
              today: new Date().toISOString().slice(0, 10),
            });
            core.setOutput('reason', res.reason);
            core.info(res.reason);
            if (!res.approved) return;
            core.setOutput('approved_by', res.approvedBy);
            const text = JSON.stringify(res.record, null, 2);
            core.info(`AVRS record (filed in the repo after merge):\n${text}`);
            await core.summary.addHeading('AVRS record (filed after merge)').addCodeBlock(text, 'json').write();

  gate:
    needs: [auto-authorize, dependabot-approval]
    if: always() && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use branch ref — not the event SHA — so we see commits auto-authorize
          # may have added before this job started.
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Pull latest branch state
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"

      - name: Fetch Base Branch
        run: git fetch origin main:main

      - name: Run Alteration Gate (Fail-Closed)
        env:
          MK2_BASE_REF: ${{ github.event.pull_request.base.sha || 'main' }}
          MK2_RECORD_COMMIT_SHA: ${{ needs.auto-authorize.outputs.record_commit_sha }}
          MK2_BACKFILL_VERIFIED: ${{ needs.auto-authorize.outputs.backfill_verified }}
          MK2_IS_DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
          MK2_DEPENDABOT_APPROVED_BY: ${{ needs.dependabot-approval.outputs.approved_by }}
          MK2_DEPENDABOT_REASON: ${{ needs.dependabot-approval.outputs.reason }}
        run: python3 tools/ci_gate.py

      # ── Permanent fix for HEAD-mismatch bug ─────────────────────────────────
      # auto-authorize commits the auth record AFTER the workflow was triggered,
      # moving the branch HEAD. GitHub registers this job's check run against the
      # triggered SHA, not the new HEAD. The branch protection wants `gate` on
      # the current HEAD — they never match without this step.
      #
      # This step runs only when ci_gate.py passes (no if:always — failure stops
      # it). It checks if HEAD moved; if so, it explicitly registers a passing
      # `gate` check run on the new SHA. Self-healing. No re-trigger needed.
      - name: Register gate result on current HEAD
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const currentSha  = execSync('git rev-parse HEAD').toString().trim();
            // The PR head this run was triggered for. (context.sha is the
            // merge-ref commit, which never equals the branch head, so it made
            // this step fire on every run, which fails on read-only Dependabot
            // runs.) It only differs when auto-authorize pushed a record.
            const triggeredSha = context.payload.pull_request.head.sha;

            if (currentSha === triggeredSha) {
              core.info('HEAD unchanged — automatic check run covers current HEAD. Done.');
              return;
            }

            core.info(`HEAD moved after auto-authorize: ${triggeredSha.slice(0,12)} → ${currentSha.slice(0,12)}`);
            core.info('Registering gate check run on current HEAD...');

            await github.rest.checks.create({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              name:         'gate',
              head_sha:     currentSha,
              status:       'completed',
              conclusion:   'success',
              started_at:   new Date().toISOString(),
              completed_at: new Date().toISOString(),
              output: {
                title:   'Mk2 Alteration Gate',
                summary: 'Gate passed. Authorization record verified. Check registered on post-auto-authorize HEAD.',
              },
            });

            core.info(`Gate check registered on ${currentSha.slice(0,12)}. No re-trigger needed.`);
