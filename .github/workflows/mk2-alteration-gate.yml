name: mk2-alteration-gate

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

# auto-authorize commits and pushes an authorization record mid-run, which
# fires a second, near-simultaneous synchronize event on this same PR. Without
# this guard, that second event's run can start while the first is still
# mid-flight, racing it and occasionally failing to schedule at all ("workflow
# file issue", 0 jobs) — not a real gate failure, just two evaluations of the
# same PR colliding. queued (not cancelled): the second run still needs to
# complete for jobs unrelated to the auth-record commit; cancelling it would
# lose that.
concurrency:
  group: mk2-alteration-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  # Runs first — creates the authorization record if the actor is allowlisted
  # and no record exists yet. Skips cleanly when actor is github-actions[bot]
  # (prevents infinite loop when this job's own commit triggers synchronize).
  auto-authorize:
    if: |
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      is_allowed: ${{ steps.check-allowlist.outputs.is_allowed }}
      record_commit_sha: ${{ steps.record-commit.outputs.record_commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR head branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Fetch base ref for diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"

      - name: Fetch approved reviews
        id: fetch-reviews
        uses: actions/github-script@v7
        with:
          script: |
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const approved = reviews.data
              .filter(r => r.state === 'APPROVED')
              .map(r => ({ login: r.user.login }));
            core.setOutput('approved_reviewers', JSON.stringify(approved));

      - name: Determine authorized login
        id: check-allowlist
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          actor = os.environ["ACTOR"]
          allowlist_path = "governance/alteration-program/authorization/allowlist.json"
          try:
              with open(allowlist_path, encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"WARNING: could not read allowlist: {e}", file=sys.stderr)
              data = {}

          logins = data.get("authorizedLogins", [])

          def parse_logins(env_var):
              raw = os.environ.get(env_var, "[]")
              try:
                  items = json.loads(raw)
                  return [
                      item["login"]
                      for item in items
                      if isinstance(item, dict) and "login" in item
                  ]
              except (json.JSONDecodeError, TypeError) as e:
                  print(f"WARNING: could not parse {env_var}: {e}", file=sys.stderr)
                  return []

          assignee_logins = parse_logins("ASSIGNEES_JSON")
          reviewer_logins = parse_logins("REVIEWERS_JSON")
          approved_reviewer_logins = parse_logins("APPROVED_REVIEWERS_JSON")

          # Being merely assigned or requested as a reviewer is not
          # involvement -- either can happen with zero action from that
          # person. Only an actual approval (or self-authorship by an
          # allowlisted login) counts as authorization. Same fix as
          # SQUAD's squad-alteration-gate.yml (this workflow's own source
          # pattern), applied here after an independent audit found the
          # same bug in this copy.
          authorized_by = None
          for login in approved_reviewer_logins + [actor]:
              if login in logins:
                  authorized_by = login
                  break

          is_allowed = authorized_by is not None
          print(f"Actor: {actor!r}")
          print(f"Assignees (not authorizing): {assignee_logins}, Requested reviewers (not authorizing): {reviewer_logins}")
          print(f"Approved reviewers: {approved_reviewer_logins}")
          print(f"authorizedLogins: {logins}")
          print(f"authorizedBy: {authorized_by!r}, allowed: {is_allowed}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"is_allowed={'true' if is_allowed else 'false'}\n")
              if authorized_by:
                  out.write(f"authorized_by={authorized_by}\n")
          PYEOF
        env:
          ACTOR:                  ${{ github.actor }}
          ASSIGNEES_JSON:         ${{ toJson(github.event.pull_request.assignees) }}
          REVIEWERS_JSON:         ${{ toJson(github.event.pull_request.requested_reviewers) }}
          APPROVED_REVIEWERS_JSON: ${{ steps.fetch-reviews.outputs.approved_reviewers }}

      - name: Check if authorization record already exists in this PR
        id: check-record
        if: steps.check-allowlist.outputs.is_allowed == 'true'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          RECORD_COUNT=$(git diff --name-only "${BASE_SHA}...HEAD" \
            | grep -cE "^governance/alteration-program/authorization/records/.*\.json$" || true)
          echo "record_count=${RECORD_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Authorization records in PR changeset: ${RECORD_COUNT}"

      - name: Create authorization record
        id: create-record
        if: >
          steps.check-allowlist.outputs.is_allowed == 'true' &&
          steps.check-record.outputs.record_count == '0'
        run: |
          python3 - <<'PYEOF'
          import json, os
          from datetime import date

          authorized_by = os.environ["AUTHORIZED_BY"]
          actor         = os.environ["ACTOR"]
          pr_number     = int(os.environ["PR_NUMBER"])
          title         = os.environ["TITLE"]
          today         = date.today().isoformat()

          record_file = (
              f"governance/alteration-program/authorization/records/"
              f"{today}-pr-{pr_number}.json"
          )

          logic = f"{authorized_by} authorized via allowlist for PR #{pr_number}: {title}"
          if actor != authorized_by:
              logic += f" (PR opened by {actor})"

          record = {
              "governance_record":   f"{today}-pr-{pr_number}",
              "authorization_logic": logic,
              "signature":           f"{authorized_by}-{today}-pr{pr_number}",
              "authorizedBy":        authorized_by,
              "authorizedAt":        today,
              "reason":              f"PR #{pr_number}: {title}",
              "pullRequest":         pr_number,
          }

          os.makedirs(os.path.dirname(record_file), exist_ok=True)
          with open(record_file, "w", encoding="utf-8") as f:
              json.dump(record, f, indent=2)
              f.write("\n")

          print(f"Created authorization record: {record_file}")
          print(json.dumps(record, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"record_file={record_file}\n")
          PYEOF
        env:
          AUTHORIZED_BY: ${{ steps.check-allowlist.outputs.authorized_by }}
          ACTOR:         ${{ github.actor }}
          PR_NUMBER:     ${{ github.event.pull_request.number }}
          TITLE:         ${{ github.event.pull_request.title }}

      - name: Commit authorization record
        if: >
          steps.check-allowlist.outputs.is_allowed == 'true' &&
          steps.check-record.outputs.record_count == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/alteration-program/authorization/records/
          if git diff --staged --quiet; then
            echo "No authorization record changes to commit."
            exit 0
          fi
          git commit -m "chore: add governance authorization for PR #${{ github.event.pull_request.number }}"
          git push

      # Independent-audit finding (2026-09-07, round 8, critical, found via
      # SQUAD's independent audit of this same pattern -- see SQUAD#69):
      # ci_gate.py used to accept ANY well-formed authorization record whose
      # authorizedBy matched an allowlisted login -- it never verified the
      # record was actually produced by this job. A hand-written record
      # committed directly as part of an attacker's own PR (no real review,
      # no real approval) passed every check.
      #
      # This step vouches for exactly one thing: whichever commit currently
      # introduces this PR's authorization record, at the moment this job's
      # OWN live, this-run GitHub API-based authorization check (is_allowed,
      # above) says true. It runs whether this run just created the record
      # or one already existed from an earlier legitimate run on this same
      # PR -- either way, is_allowed was independently recomputed from live
      # GitHub state THIS run, not read back from the record file itself.
      # The output only reaches ci_gate.py through GitHub Actions' own
      # job-to-job data plane (needs.auto-authorize.outputs.*) -- a value an
      # attacker's own PR-branch commits cannot inject, unlike git commit
      # author/committer metadata, which is trivially spoofable locally.
      - name: Determine trusted record commit
        id: record-commit
        if: steps.check-allowlist.outputs.is_allowed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          RECORD_FILE=$(ls governance/alteration-program/authorization/records/*-pr-"${PR_NUMBER}".json 2>/dev/null | head -n1 || true)
          if [ -z "$RECORD_FILE" ]; then
            echo "No authorization record file found for PR #${PR_NUMBER} -- nothing to vouch for."
            exit 0
          fi
          RECORD_SHA=$(git log -1 --format=%H -- "$RECORD_FILE")
          echo "record_commit_sha=${RECORD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Vouching for ${RECORD_FILE} at commit ${RECORD_SHA} (is_allowed=true this run)."

      - name: Comment on PR
        if: >
          steps.check-allowlist.outputs.is_allowed == 'true' &&
          steps.check-record.outputs.record_count == '0'
        uses: actions/github-script@v7
        env:
          AUTHORIZED_BY: ${{ steps.check-allowlist.outputs.authorized_by }}
        with:
          script: |
            const authorizedBy = process.env.AUTHORIZED_BY;
            const actor = context.actor;
            if (!authorizedBy) {
              core.warning('authorized_by is unexpectedly empty; skipping comment.');
              return;
            }
            const byLine = authorizedBy !== actor
              ? `\`${authorizedBy}\` (sponsor) on behalf of \`${actor}\``
              : `\`${authorizedBy}\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body:
                '✅ **Authorization Record Auto-Created**\n\n' +
                'A governance authorization record has been automatically created for this PR ' +
                `by ${byLine} from the authorized allowlist.\n\n` +
                'The `gate` check will run after this job completes and should pass. ' +
                '**No further action is needed.**'
            })

  # Runs after auto-authorize (or after it is skipped). Checks out the latest
  # branch HEAD so it sees any auth record auto-authorize may have just committed.
  gate:
    needs: auto-authorize
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use branch ref — not the event SHA — so we see commits auto-authorize
          # may have added before this job started.
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Pull latest branch state
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"

      - name: Fetch Base Branch
        run: git fetch origin main:main

      - name: Run Alteration Gate (Fail-Closed)
        env:
          MK2_BASE_REF: ${{ github.event.pull_request.base.sha || 'main' }}
          MK2_RECORD_COMMIT_SHA: ${{ needs.auto-authorize.outputs.record_commit_sha }}
        run: python3 tools/ci_gate.py

      # ── Permanent fix for HEAD-mismatch bug ─────────────────────────────────
      # auto-authorize commits the auth record AFTER the workflow was triggered,
      # moving the branch HEAD. GitHub registers this job's check run against the
      # triggered SHA, not the new HEAD. The branch protection wants `gate` on
      # the current HEAD — they never match without this step.
      #
      # This step runs only when ci_gate.py passes (no if:always — failure stops
      # it). It checks if HEAD moved; if so, it explicitly registers a passing
      # `gate` check run on the new SHA. Self-healing. No re-trigger needed.
      - name: Register gate result on current HEAD
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const currentSha  = execSync('git rev-parse HEAD').toString().trim();
            const triggeredSha = context.sha;

            if (currentSha === triggeredSha) {
              core.info('HEAD unchanged — automatic check run covers current HEAD. Done.');
              return;
            }

            core.info(`HEAD moved after auto-authorize: ${triggeredSha.slice(0,12)} → ${currentSha.slice(0,12)}`);
            core.info('Registering gate check run on current HEAD...');

            await github.rest.checks.create({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              name:         'gate',
              head_sha:     currentSha,
              status:       'completed',
              conclusion:   'success',
              started_at:   new Date().toISOString(),
              completed_at: new Date().toISOString(),
              output: {
                title:   'Mk2 Alteration Gate',
                summary: 'Gate passed. Authorization record verified. Check registered on post-auto-authorize HEAD.',
              },
            });

            core.info(`Gate check registered on ${currentSha.slice(0,12)}. No re-trigger needed.`);
